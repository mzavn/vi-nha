name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (test) cần Node 22.13 trở lên
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # python3 có sẵn trên ubuntu-latest
      - run: npm run specs:check
